name: Publish Helm Charts

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  helm:
    permissions:
      contents: read
      packages: write
    uses: joeckr/ci-templates/.github/workflows/push-helm-ghcr.yml@c08d40f0bf0cd80de6b2f1fa2f018f944265b807 # v1.8.0
    with:
      charts-dir: 'charts'
